# ============================================================
# portalon-http.conf — Nginx HTTP-only (sin SSL)
# ============================================================
# Para demo rápida con dominio pero sin certificado SSL todavía.
# Reemplaza TU_DOMINIO.COM con tu dominio real.
#
# ACTIVAR: sustituye portalon.conf por este archivo,
#          o renómbralo como portalon.conf mientras no tengas SSL.
#
# Luego obtener SSL con Certbot:
#   certbot certonly --webroot -w /var/www/certbot -d TU_DOMINIO.COM
#   # Después cambiar a portalon.conf (la versión HTTPS)
# ============================================================

server {
    listen 80;
    server_name TU_DOMINIO.COM www.TU_DOMINIO.COM;

    # Preparado para certbot cuando quieras añadir SSL
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # API — NestJS backend
    location /api/ {
        limit_req zone=api burst=20 nodelay;

        proxy_pass http://backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # Formulario de lead — rate limit estricto
    location /api/v1/leads/public {
        limit_req zone=leads burst=5 nodelay;

        proxy_pass http://backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Frontend — Next.js
    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    location /_next/static/ {
        proxy_pass http://frontend:3000;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
